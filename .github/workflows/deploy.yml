name: CI/CD Habit Tracker

on:
  push:
    branches:
      - first_branch
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: habit_tracker.settings
      SECRET_KEY: test-secret-key
      DEBUG: "True"
      CORS_ALLOWED_ORIGINS: http://localhost
      TELEGRAM_BOT_TOKEN: test-token

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
    
      - name: Debug paths
        run: |
          pwd
          ls -la
          ls -la habit_tracker
    
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
    
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r habit_tracker/requirements.txt
    
      - name: Run linters
        run: |
          pip install flake8 black
          flake8 habit_tracker
    
      - name: Run migrations
        run: |
          python habit_tracker/manage.py migrate
    
      - name: Run tests
        run: |
          pytest
    
      - name: Build Docker images
        run: docker compose -f habit_tracker/docker-compose.yml build

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: |
            docker-compose.yml
            .env
          target: /home/${{ secrets.SERVER_USER }}/Atomic_Habits/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/Atomic_Habits
            docker compose pull
            docker compose up -d --build
            docker system prune -f
