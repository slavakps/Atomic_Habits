[pytest]
DJANGO_SETTINGS_MODULE = habit_tracker.settings
python_files = tests.py test_*.py *_tests.py

addopts =
    --strict-markers
    --disable-warnings
    --cov=.
    --cov-report=term-missing

testpaths =
    habits/tests
    users/tests

norecursedirs =
    .idea
    .venv
    venv
    migrations
    __pycache__
